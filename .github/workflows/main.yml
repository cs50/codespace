on:
  - push
  - workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-2404-64-cores-amd
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log into GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Only use `build` and `features`, if any, from devcontainer.json
        run: |
          pip3 install jsmin
          python3 -c "import jsmin, json; f = open('devcontainer.json', 'r'); data = json.loads(jsmin.jsmin(f.read())); o = {}; o['build']=data['build']; o['features']=data.get('features', []); o['remoteEnv']=data['remoteEnv']; f.close(); f = open('devcontainer.json', 'w'); f.write(json.dumps(o, indent=4)); f.close()"

      - name: Build (latest)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          export TAG=${{ matrix.arch }}
          export VCS_REF=$(git rev-parse HEAD)
          npm install -g @devcontainers/cli
          devcontainer build --workspace-folder . --config devcontainer.json --image-name cs50/codespace:${{ github.sha }}-${{ matrix.arch }}

      - name: Smoke-test (latest)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          bash tests/smoke.sh cs50/codespace:${{ github.sha }}-${{ matrix.arch }}

      - name: Push (latest) to GitHub Packages
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker tag cs50/codespace:${{ github.sha }}-${{ matrix.arch }} ghcr.io/cs50/codespace:${{ github.sha }}-${{ matrix.arch }}
          docker push ghcr.io/cs50/codespace:${{ github.sha }}-${{ matrix.arch }}

      - name: Push to Docker Hub (latest)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          docker push cs50/codespace:${{ github.sha }}-${{ matrix.arch }}

      - name: Build (canary)
        if: ${{ github.ref == 'refs/heads/canary' }}
        run: |
          export TAG=canary
          export VCS_REF=$(git rev-parse HEAD)
          npm install -g @devcontainers/cli
          devcontainer build --workspace-folder . --config devcontainer.json --image-name cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }}

      - name: Build (${{ github.ref_name}})
        if: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/canary' }}
        run: |
          export TAG=${{ matrix.arch }}
          export VCS_REF=$(git rev-parse HEAD)
          npm install -g @devcontainers/cli
          devcontainer build --workspace-folder . --config devcontainer.json --image-name cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }}

      - name: Smoke-test (${{ github.ref_name }})
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          bash tests/smoke.sh cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }}

      - name: Squash (${{ github.ref_name }})
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          pip3 install docker-squash
          docker-squash --tag cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }} cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }}

      - name: Push (${{ github.ref_name }}) to GitHub Packages
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          docker tag cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }} ghcr.io/cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }}
          docker push ghcr.io/cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }}

      - name: Push to Docker Hub (${{ github.ref_name }})
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          docker push cs50/codespace:${{ github.ref_name }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log into GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags (latest)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          for repo in ghcr.io/cs50/codespace cs50/codespace; do
            docker buildx imagetools create \
              --tag $repo:${{ github.sha }} --tag $repo:latest \
              $repo:${{ github.sha }}-amd64 $repo:${{ github.sha }}-arm64
          done

      - name: Create multi-arch tags (${{ github.ref_name }})
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/cs50/codespace:${{ github.ref_name }} \
            ghcr.io/cs50/codespace:${{ github.ref_name }}-amd64 ghcr.io/cs50/codespace:${{ github.ref_name }}-arm64
          docker buildx imagetools create \
            --tag cs50/codespace:${{ github.ref_name }} --tag cs50/codespace:${{ github.sha }} \
            cs50/codespace:${{ github.ref_name }}-amd64 cs50/codespace:${{ github.ref_name }}-arm64

      - name: Tag main as latest
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/latest",
                sha: context.sha,
                force: true
              })
            } catch (e) {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "refs/tags/latest",
                sha: context.sha
              })
            }
